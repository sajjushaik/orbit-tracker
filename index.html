async function pullCloud(){
 if(!cloud.user||cloud.dirty||cloud.busy)return;
 const {data,error}=await cloudClient.from('orbit_cloud_state').select('data,updated_at').eq('user_id',cloud.user.id).maybeSingle();
 if(error){setCloudStatus('⚠ Unable to load cloud data');console.error(error);return}
 if(data?.data&&data.data.version===1){db={...blank(),...data.data,settings:{...DEFAULTS,...data.data.settings}}}
 else db=blank();
 try{localStorage.setItem(KEY+'-'+cloud.user.id,JSON.stringify(db))}catch(e){}
 render();setCloudStatus('✓ Connected to Supabase');
}
async function bootstrapCloud(){
 if(!cloudClient){cloud.ready=true;render();return}
 const {data:{session},error}=await cloudClient.auth.getSession();
 cloud.user=session?.user||null;cloud.ready=true;
 if(error)console.warn(error);
 if(cloud.user)await pullCloud();else render();
 cloudClient.auth.onAuthStateChange((_event,session)=>{
  const next=session?.user||null;
  if(cloud.user?.id!==next?.id){cloud.user=next;cloud.dirty=false;clearTimeout(cloud.timer);db=blank();render();if(next)setTimeout(()=>void pullCloud(),50)}
 });
}
async function submitCloudLogin(e){
 e.preventDefault();if(!cloudClient){toast('Supabase library unavailable. Check Internet connection.');return}
 const email=document.getElementById('cloud-email').value.trim();
 const password=document.getElementById('cloud-password').value;
 const mode=document.getElementById('cloud-login-mode').value;
 const btn=document.getElementById('cloud-submit');btn.disabled=true;btn.textContent='Please wait…';
 try{
  const response=mode==='signup'?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});
  if(response.error)throw response.error;
  if(response.data.session){cloud.user=response.data.user;await pullCloud();toast('Signed in successfully')}
  else{btn.disabled=false;btn.textContent='Continue';document.getElementById('cloud-auth-message').textContent='Check your email for the confirmation link. Then return here and sign in.'}
 }catch(err){btn.disabled=false;btn.textContent='Continue';document.getElementById('cloud-auth-message').textContent=err.message}
}

function update(){save();render()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function blank(){return {version:1,demo:false,settings:JSON.parse(JSON.stringify(DEFAULTS)),attendance:{},expenses:[],rules:{},plans:{},travel:{},tickets:{}}}
function parseRailwayStatus(raw){
 // Parse common *current-status* formats only. Never infer a seat from WL/RAC or booking-history data.
 const text=String(raw||'').toUpperCase().replace(/\s+/g,' ').trim();
 if(!text||/\b(?:WL|WAITLIST|RAC|CAN|CANCELLED)\b/.test(text)&&!/\bCNF\b|CONFIRMED/.test(text))return null;
 const m=text.match(/(?:\bCNF\s*[/,:-]?\s*|\bCONFIRMED\s*[/,:-]?\s*)?\b([A-Z]{1,3}\d{1,2})\s*[/,;:\- ]+\s*(?:BERTH|SEAT|NO\.?|NUMBER)?\s*(\d{1,3})\b/);
 if(!m)return null;
 const seat=Number(m[2]);if(seat<1||seat>120)return null;
 return {coach:m[1],seat:String(seat),status: /\bCNF\b|CONFIRMED/.test(text)?'CNF':'Seat shown (verify)'};
}
function travelKinds(date){return Array.isArray(db.travel?.[date])?db.travel[date]:[]}
function travelCount(a,b){return Object.entries(db.travel||{}).reduce((n,[date,arr])=>n+(between(date,a,b)&&Array.isArray(arr)?arr.length:0),0)}
function attendance(d){return db.attendance[d]?.status||'none'}
function expenseTotal(a,b){return db.expenses.reduce((s,e)=>s+(between(e.date,a,b)?num(e.amount):0),0)}
function expenseDay(date){return expenseTotal(date,date)}
function countStatus(a,b,status){return Object.entries(db.attendance).filter(([d,v])=>between(d,a,b)&&v.status===status).length}
function effectiveTarget(ws){const policy=(db.settings.policy||[]).filter(p=>p.from<=ws).sort((a,b)=>a.from.localeCompare(b.from));return db.rules[ws]?.target??(policy.length?policy.at(-1).target:db.settings.weeklyTarget)}
function planned(d){if(Object.prototype.hasOwnProperty.call(db.plans,d))return !!db.plans[d];if(['holiday','leave'].includes(attendance(d)))return false;return db.settings.preferred.includes(parseDate(d).getDay())}
function weekly(ws){
 const end=weekEnd(ws),target=(db.rules[ws]?.target??((db.settings.policy||[]).filter(p=>p.from<=ws).sort((a,b)=>a.from.localeCompare(b.from)).at(-1)?.target??db.settings.weeklyTarget));
 const actual=countStatus(ws,end,'office'),holiday=countStatus(ws,end,'holiday'),leave=countStatus(ws,end,'leave');
 const credited=actual+holiday+leave,plan=allDates(ws,end).filter(planned).length,remaining=Math.max(0,target-credited);
 const available=allDates(ws,end).filter(d=>d>=TODAY&&!['office','holiday','leave'].includes(attendance(d))&&parseDate(d).getDay()!==0).length;
 let status='ontrack';if(credited>target)status='ahead';else if(credited===target)status='achieved';else if(end<TODAY||remaining>available)status='behind';
 else {const expected=allDates(ws,end).filter(d=>d<=TODAY&&planned(d)).length;if(credited<Math.min(target,expected))status='behind'}
 return {start:ws,end,target,actual,credited,plan,remaining,available,status,spend:expenseTotal(ws,end),remote:countStatus(ws,end,'remote'),holiday,leave};
}
function weeksIntersecting(a,b){const out=[];for(let w=weekStart(a);w<=b;w=addDays(w,7))out.push(w);return out}
function monthStats(ms){const end=monthEnd(ms);const days=allDates(ms,end);let target=0;for(let w of weeksIntersecting(ms,end)){const overlap=allDates(w,weekEnd(w)).filter(d=>between(d,ms,end));const working=allDates(w,weekEnd(w)).filter(d=>parseDate(d).getDay()!==0&&parseDate(d).getDay()!==6);const workingOverlap=overlap.filter(d=>parseDate(d).getDay()!==0&&parseDate(d).getDay()!==6);target+=working.length?effectiveTarget(w)*workingOverlap.length/working.length:0}
// Monthly target is a proportional allocation of the weekly requirement across weekdays in the month.
const actual=countStatus(ms,end,'office'),credited=actual+countStatus(ms,end,'holiday')+countStatus(ms,end,'leave'),spend=expenseTotal(ms,end);return {start:ms,end,target:Math.round(target*10)/10,actual,credited,planned:days.filter(planned).length,remote:countStatus(ms,end,'remote'),holiday:countStatus(ms,end,'holiday'),leave:countStatus(ms,end,'leave'),spend,percentage:target?Math.round(credited/target*100):100,average:actual?spend/actual:0}}
function selectedStats(){const w=weekly(weekStart(TODAY)),m=monthStats(monthStart(TODAY));return {w,m}}
function badge(status){const cfg={achieved:['green','✓ Target achieved'],ahead:['green','↗ Ahead of target'],ontrack:['amber','◷ On track'],behind:['red','! Behind schedule']}[status]||['neutral','—'];return `<span class="status-pill ${cfg[0]}">${cfg[1]}</span>`}
function metric(label,val,foot,icon,tone='',progress=null){return `<div class="card metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value ${tone}">${val}</div>${progress===null?'':`<div class="progress"><span style="width:${Math.min(100,Math.max(0,progress))}%"></span></div>`}<div class="metric-foot">${foot}</div></div>`}
function panel(title,subtitle,content,extra=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p class="panel-sub">${subtitle}</p>`:''}</div>${extra}</div>${content}</section>`}
function empty(message='No records yet',detail='Add an attendance or expense entry to get started.') {return `<div class="empty"><div style="font-size:28px">◇</div><strong>${message}</strong>${detail}</div>`}
function chart(data,mode='bar',valueKey='value',compareKey=null){if(!data.length)return empty();const max=Math.max(1,...data.map(d=>Math.max(num(d[valueKey]),num(d[compareKey]))));const W=600,H=215,L=42,R=13,T=14,B=31,innerW=W-L-R,innerH=H-T-B;const ticks=[0,.25,.5,.75,1].map(f=>`<line class="gridline" x1="${L}" x2="${W-R}" y1="${T+innerH*(1-f)}" y2="${T+innerH*(1-f)}"/><text x="${L-7}" y="${T+innerH*(1-f)+4}" text-anchor="end">${compact(max*f)}</text>`).join('');let shapes='';const band=innerW/data.length;
if(mode==='line'){for(const [k,color] of [[valueKey,'#5867e4'],...(compareKey?[[compareKey,'#42b895']]:[])]){const path=data.map((d,i)=>`${i?'L':'M'}${L+band*(i+.5)},${T+innerH*(1-num(d[k])/max)}`).join(' ');shapes+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;for(let i=0;i<data.length;i++){let x=L+band*(i+.5),y=T+innerH*(1-num(data[i][k])/max);shapes+=`<circle cx="${x}" cy="${y}" r="4" fill="${color}"><title>${esc(data[i].label)}: ${num(data[i][k]).toLocaleString('en-IN')}</title></circle>`}}}else{data.forEach((d,i)=>{const x=L+i*band+band*.14,w=band*(compareKey?.31:.66),h=innerH*num(d[valueKey])/max;shapes+=`<rect class="bar" x="${x}" y="${T+innerH-h}" width="${Math.max(2,w)}" height="${Math.max(0,h)}" rx="3" fill="#5867e4"><title>${esc(d.label)}: ${num(d[valueKey]).toLocaleString('en-IN')}</title></rect>`;if(compareKey){let h2=innerH*num(d[compareKey])/max;shapes+=`<rect class="bar" x="${x+w+3}" y="${T+innerH-h2}" width="${Math.max(2,w)}" height="${h2}" rx="3" fill="#42b895"><title>${esc(d.label)}: ${num(d[compareKey]).toLocaleString('en-IN')}</title></rect>`}})}const labels=data.map((d,i)=>`<text x="${L+band*(i+.5)}" y="${H-8}" text-anchor="middle">${esc(data.length>12?d.short||'':d.short||d.label)}</text>`).join('');return `<svg class="chart" role="img" aria-label="Trend chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ticks}${shapes}${labels}</svg>`}
function monthsBack(n,end=monthStart(TODAY)){return Array.from({length:n},(_,i)=>addMonths(end,i-n+1))}
function weekSeries(n=8){const now=weekStart(TODAY);return Array.from({length:n},(_,i)=>{const w=addDays(now,(i-n+1)*7),s=weekly(w);return {label:fmt(w,{month:'short',day:'numeric'}),short:fmt(w,{day:'numeric',month:'short'}),value:s.actual,compare:s.target,spend:s.spend}})}
function monthSeries(n=6){return monthsBack(n).map(m=>{const s=monthStats(m);return {label:fmt(m,{month:'long',year:'numeric'}),short:fmt(m,{month:'short'}),value:s.actual,compare:s.target,spend:s.spend,percentage:s.percentage}})}
function countOfficeDaysWithExpenses(a,b){return new Set(Object.keys(db.attendance).filter(d=>between(d,a,b)&&attendance(d)==='office')).size}
function navButton(id,icon,label){return `<button class="${ui.page===id?'active':''}" data-action="navigate" data-page="${id}"><span class="nav-icon">${icon}</span>${label}</button>`}
function header(){const names={dashboard:['Good morning 👋','Your attendance at a glance'],calendar:['Attendance calendar','Plan and log every office day'],expenses:['Commute expenses','Every journey, accounted for'],analytics:['Analytics overview','Your work patterns and commute trends'],reports:['Reports & summaries','Clear records for every week and month'],settings:['Preferences','Make Orbit work for you']};const [title,sub]=names[ui.page];return `<header class="topbar"><div><div class="eyebrow">${fmt(TODAY,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="top-actions"><span class="date-chip">📍 Hyderabad commute</span><button class="btn primary" data-action="open-expense">＋ Add expense</button></div></header>`}
function render(){if(!cloud.ready){document.getElementById('app').innerHTML='<div class="splash">Connecting to Orbit…</div>';return}if(!cloud.user){document.getElementById('app').innerHTML=cloudLoginMarkup();return}document.documentElement.dataset.theme=db.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):db.settings.theme;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">◈</div><div>orbit<small>YOUR WORK RHYTHM</small></div></div><div class="nav">${NAV.map(n=>navButton(...n)).join('')}</div><div class="side-foot">☁️ <b>Cloud connected</b><span id="cloud-status">✓ Connected to Supabase</span><br><button class="btn" data-action="cloud-logout" style="margin-top:10px">Sign out</button></div></aside><main class="main">${header()}${({dashboard:renderDashboard,calendar:renderCalendar,expenses:renderExpenses,analytics:renderAnalytics,reports:renderReports,settings:renderSettings})[ui.page]()}</main><nav class="mobile-nav" aria-label="Main navigation">${NAV.map(n=>`<button data-action="navigate" data-page="${n[0]}" class="${ui.page===n[0]?'active':''}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav></div>${renderDialog()}`}
function renderDashboard(){const {w,m}=selectedStats();const todayMoney=expenseDay(TODAY);const monthPct=m.target?Math.round(m.actual/m.target*100):100;const x=weekSeries(8),y=monthSeries(6);const recent=db.expenses.filter(e=>e.date<=TODAY).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);return `<div class="cards">${metric('Office days this week',`${w.actual} <span class="muted" style="font-size:16px">/ ${w.target}</span>`,`${w.remaining} remaining · ${w.plan} planned`,'🏢','',w.target?w.actual/w.target*100:100)}${metric('Monthly attendance',`${m.actual} <span class="muted" style="font-size:16px">/ ${m.target}</span>`,`${monthPct}% completion`,'🗓','',monthPct)}${metric('Commute this month',rupee(m.spend),`${rupee(m.average)} per office day`,'💳')}${metric('This week’s commute',rupee(w.spend),`Today: ${rupee(todayMoney)}`,'🚆')}</div><div class="two-col">${panel('Your weekly progress',`${fmt(w.start)} – ${fmt(w.end)}`,`<div class="row-between"><div><div class="muted" style="font-size:12px">Required / planned / actual</div><div style="font-size:26px;font-weight:800;margin:9px 0">${w.target} <span class="muted">/</span> ${w.plan} <span class="muted">/</span> <span class="positive">${w.actual}</span></div></div>${badge(w.status)}</div><div class="progress"><span style="width:${w.target?Math.min(100,w.actual/w.target*100):100}%"></span></div><p class="muted" style="margin:12px 0 16px;font-size:12px">${w.remaining?`${w.remaining} office ${w.remaining===1?'day':'days'} still required. ${w.available} future weekdays available.`:'Weekly requirement complete.'}</p><div class="quick-actions"><button class="btn light" data-action="quick-office">🏢 Mark today: Office</button><button class="btn" data-action="open-attendance" data-date="${TODAY}">✎ Update today</button><button class="btn" data-action="edit-target" data-week="${w.start}">⚙ Edit target</button></div>`) }${panel('Attendance mix',`This month · ${fmt(m.start,{month:'long',year:'numeric'})}`,`<div class="mini-stats"><div class="mini-stat"><div class="k">🏢 Office</div><div class="v">${m.actual}</div><div class="k">days</div></div><div class="mini-stat"><div class="k">🏠 Remote</div><div class="v">${m.remote}</div><div class="k">days</div></div><div class="mini-stat"><div class="k">🌤 Holiday / leave</div><div class="v">${m.holiday+m.leave}</div><div class="k">days</div></div></div><div class="insight" style="margin-top:14px">${m.actual>m.target?'You have exceeded the monthly attendance allocation.':m.actual?'Keep your routine going. Your office-day history is building up.':'Log an office day to start tracking your attendance.'}</div>`)}</div><div class="equal-col">${panel('Office attendance trend','Last 8 weeks',chart(x,'bar','value','compare')+`<div class="legend"><span><i style="background:#5867e4"></i>Actual</span><span><i style="background:#42b895"></i>Required</span></div>`)}${panel('Commute spending trend','Last 6 months',chart(y.map(a=>({...a,value:a.spend})),'line'))}</div><div class="two-col">${panel('Quick check-in','Update today in one tap',`<div class="quick-actions">${Object.entries(STATUS).filter(([k])=>k!=='none').map(([k,v])=>`<button class="btn" data-action="quick-status" data-status="${k}">${v.icon} ${v.name}</button>`).join('')}</div><div class="divider"></div><p class="muted" style="font-size:12px">Today: <b style="color:var(--ink)">${STATUS[attendance(TODAY)].name}</b> ${db.attendance[TODAY]?.note?`· ${esc(db.attendance[TODAY].note)}`:''}</p><div style="margin-top:14px"><button class="btn light" data-action="navigate" data-page="calendar">Open full calendar →</button></div>`)}${panel('Recent expenses','Latest recorded travel costs',recent.length?`<div class="detail-list">${recent.map(e=>`<div class="detail-item"><div class="row-between"><span class="detail-icon">${CAT_ICONS[e.category]||'🧾'}</span><div><strong>${esc(e.category)}</strong><div class="muted" style="font-size:11px;margin-top:4px">${fmt(e.date)} · ${esc(e.description||'Commute expense')}</div></div></div><div class="row-between"><b>${rupee(e.amount)}</b><button class="btn small icon-only" data-action="edit-expense" data-id="${e.id}" aria-label="Edit expense">✎</button></div></div>`).join('')}</div>`:empty())}</div>${db.demo?`<div class="insight">✨ Exploring with demo data. Your edits are saved locally. <button class="btn small" style="margin-left:9px" data-action="clear-demo">Start with my own data</button></div>`:''}`}
function dailyExpenseEntries(date){
 const entries=db.expenses.filter(e=>e.date===date).slice().sort((a,b)=>a.id-b.id);
 const total=entries.reduce((sum,e)=>sum+num(e.amount),0);
 return `<section class="daily-expenses"><div class="daily-expense-heading"><div><strong>Expenses for this day</strong><small>${entries.length} ${entries.length===1?'entry':'entries'} · Total ${rupee(total)}</small></div><button type="button" class="btn small primary" data-action="open-expense" data-date="${date}">＋ Add</button></div>${entries.length?`<div class="daily-expense-list">${entries.map(e=>`<div class="daily-expense-row"><span class="expense-emoji">${CAT_ICONS[e.category]||'🧾'}</span><div class="expense-entry-detail"><strong>${esc(e.category)}</strong>${e.description?`<small>${esc(e.description)}</small>`:''}</div><b class="expense-entry-amount">${rupee(e.amount)}</b><button type="button" class="expense-icon-button" data-action="edit-expense" data-id="${e.id}" data-return-date="${date}" aria-label="Edit ${esc(e.category)} expense" title="Edit expense">✎</button><button type="button" class="expense-icon-button expense-delete" data-action="delete-expense" data-id="${e.id}" data-return-date="${date}" aria-label="Delete ${esc(e.category)} expense" title="Remove expense">🗑</button></div>`).join('')}</div>`:'<p class="muted daily-empty">No expenses yet. Add train, metro, or anything else separately.</p>'}</section>`;
}
function calendarExpenseIcons(date){
 // Render every expense entry, including repeated categories, not just travel-direction markers.
 return db.expenses.filter(e=>e.date===date).map(e=>({icon:CAT_ICONS[e.category]||'🧾',category:e.category}));
}
function calendarMarkup(month,mode='month',weekRef=null){
 const first=mode==='week'?weekStart(weekRef||TODAY,1):weekStart(month,1);
 const last=mode==='week'?first:weekStart(monthEnd(month),1);
 const names=['Mon','Tue','Wed','Thu','Fri','Sat'];
 let rows='';
 for(let ws=first;ws<=last;ws=addDays(ws,7)){
   for(let offset=0;offset<6;offset++){
     const d=addDays(ws,offset),status=attendance(d),rec=db.attendance[d],p=planned(d),change=rec?.changedFrom||rec?.changedTo,travels=travelKinds(d),expenseIcons=calendarExpenseIcons(d);
     rows+=`<button class="day orbit-day ${status==='none'?'':status} ${mode==='month'&&d.slice(0,7)!==month.slice(0,7)?'dim':''} ${d===TODAY?'today':''}" data-action="open-day-choice" data-date="${d}" aria-label="${fullDate(d)}, ${STATUS[status].name}, ${travels.length} journeys"><span class="num">${parseDate(d).getDate()}</span>${change?`<span class="changed" title="Rescheduled">↔</span>`:p?`<span class="planned" title="Planned office">●</span>`:''}<span class="day-content">${status==='none'?`<span class="day-placeholder">${p?'·':'＋'}</span>`:`<span class="tag" title="${STATUS[status].name}">${STATUS[status].icon} <span class="tag-label">${STATUS[status].name}</span></span>`}${expenseIcons.length?`<span class="expense-emoji-strip" title="${esc(expenseIcons.map(e=>e.category).join(', '))}" aria-label="Expenses: ${esc(expenseIcons.map(e=>e.category).join(', '))}">${expenseIcons.map(e=>`<span class="expense-emoji-item" title="${esc(e.category)}">${e.icon}</span>`).join('')}</span>`:''}${travels.length&&!expenseIcons.some(e=>e.category==='Train')?`<span class="travel-chip" title="Journey logged">🚆</span>`:''}</span>${expenseDay(d)?`<span class="money">${rupee(expenseDay(d))}</span>`:''}</button>`;
   }
   const w=weekly(ws),credit=w.credited,done=credit>=w.target;
   rows+=`<button class="week-credit ${done?'complete':w.status==='behind'?'shortfall':'pending'}" data-action="edit-target" data-week="${ws}" title="Office ${w.actual} · Holiday ${w.holiday} · Leave ${w.leave} · Target ${w.target}. Tap to edit weekly target" aria-label="Week of ${fmt(ws)}, credited ${credit} of ${w.target}, edit weekly target"><span class="week-credit-label">WEEK</span><strong>${credit}/${w.target}</strong><small>${done?'✓ Met':w.remaining+' left'}</small><span class="week-expense-label">Spent</span><span class="week-expense-total">${rupee(w.spend)}</span></button>`;
 }

if(d.type==='confirm-delete-expense'){
 const entry=db.expenses.find(e=>String(e.id)===String(d.id));
 content=`<div class="dialog-head"><div><p class="eyebrow">REMOVE EXPENSE</p><h2>Delete this entry?</h2><p class="muted">${entry?`${esc(entry.category)} · ${rupee(entry.amount)} · ${fmt(entry.date)}`:'This expense'} will be permanently removed. Other expenses on the day will remain.</p></div><button class="close" data-action="cancel-delete-expense">×</button></div><div class="dialog-actions"><button type="button" class="btn" data-action="cancel-delete-expense">Keep expense</button><button type="button" class="btn danger" data-action="confirm-delete-expense" data-id="${esc(d.id)}">Yes, delete</button></div>`;
}
if(d.type==='office-quick'){
 const date=d.date,st=attendance(date);content=`<div class="dialog-head"><div><p class="eyebrow">MARK ATTENDANCE</p><h2>${fullDate(date)}</h2><p class="muted">Just pick one. Your day is saved instantly.</p></div><button class="close" data-action="close-dialog" aria-label="Close">×</button></div><div class="quick-status-list">${[['office','🏢','Office','Count as an in-office day'],['remote','🏠','Home','Working from home'],['leave','🌴','Leave','Approved leave day'],['holiday','☀️','Holiday','A day off from work']].map(([v,icon,title,sub])=>`<button class="quick-status ${st===v?'current':''}" data-action="save-quick-status" data-status="${v}" data-date="${date}"><span class="quick-status-icon">${icon}</span><span><b>${title}</b><small>${sub}</small></span><span class="quick-status-check">${st===v?'✓':'→'}</span></button>`).join('')}</div><div class="quick-status-footer"><button class="btn small" data-action="open-attendance" data-date="${date}">More options · Notes & rescheduling</button><button class="btn small" data-action="open-day-choice" data-date="${date}">← Back</button></div>${st!=='none'?`<button class="clear-status" data-action="save-quick-status" data-status="none" data-date="${date}">Clear attendance for this day</button>`:''}`;
}
if(d.type==='travel-quick'){
 const date=d.date,tr=travelKinds(date);
 content=`<div class="dialog-head"><div><p class="eyebrow">YOUR JOURNEY</p><h2>${fullDate(date)}</h2><p class="muted">Tap a direction to record your journey.</p></div><button class="close" data-action="close-dialog" aria-label="Close">×</button></div><div class="trip-route"><span class="route-node">⌂ <small>Home</small></span><span class="route-line">······ 🚆 ······</span><span class="route-node">▣ <small>Hyderabad office</small></span></div><div class="quick-status-list">${[['outbound','↗','Going to office','Home → Hyderabad'],['return','↙','Coming back home','Hyderabad → Home']].map(([v,icon,title,sub])=>`<button class="quick-status travel-status ${tr.includes(v)?'current':''}" data-action="toggle-journey" data-kind="${v}" data-date="${date}"><span class="quick-status-icon">${icon}</span><span><b>${title}</b><small>${sub}</small></span><span class="quick-status-check">${tr.includes(v)?'✓':'＋'}</span></button>`).join('')}</div><div class="quick-status-footer"><button class="btn" data-action="open-day-choice" data-date="${date}">← Back</button></div>${dailyExpenseEntries(date)}`;
}
if(d.type==='attendance'){const date=d.date,rec=db.attendance[date]||{},status=rec.status||'none',p=planned(date),daily=db.expenses.filter(e=>e.date===date);content=`<div class="dialog-head"><div><p class="eyebrow">DAILY ATTENDANCE</p><h2>${fullDate(date)}</h2></div><button class="close" data-action="close-dialog" aria-label="Close">×</button></div><form id="attendance-form"><input type="hidden" name="date" value="${date}"><label class="field"><span class="heavy">Attendance status</span></label><div class="status-options">${Object.entries(STATUS).map(([key,v])=>`<button type="button" data-action="pick-status" data-status="${key}" class="status-choice ${status===key?'selected':''}">${v.icon} ${v.name}</button>`).join('')}</div><input type="hidden" id="attendance-status" name="status" value="${status}"><div class="field inline"><input type="checkbox" id="attendance-planned" ${p?'checked':''}><label for="attendance-planned">Planned office day (independent of actual status)</label></div><div class="field"><label for="attendance-note">Notes (optional)</label><textarea id="attendance-note" maxlength="400" placeholder="e.g. Client meeting / approved WFH">${esc(rec.note||'')}</textarea></div><div class="field"><label for="attendance-reschedule">Move this planned office day to (optional)</label><input type="date" id="attendance-reschedule" min="2020-01-01" max="2099-12-31"></div><p class="footnote">Rescheduling marks the original day as unplanned and the new date as planned. It does not automatically mark attendance on the new date.</p>${dailyExpenseEntries(date)}<div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="button" class="btn primary" data-action="save-attendance-day">Save day</button></div></form>`}
if(d.type==='expense'){const e=db.expenses.find(x=>String(x.id)===String(d.id))||{date:d.date||TODAY,category:'Train',amount:'',description:''};content=`<div class="dialog-head"><div><p class="eyebrow">COMMUTE EXPENSE</p><h2>${d.id?'Edit expense':'Add new expense'}</h2></div><button class="close" data-action="close-dialog" aria-label="Close">×</button></div><div id="expense-form"><div class="form-grid"><div class="field"><label for="exp-date">Date</label><input type="date" id="exp-date" value="${e.date}" required min="2020-01-01" max="2099-12-31"></div><div class="field"><label for="exp-category">Category</label><select id="exp-category">${CATS.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label for="exp-amount">Amount (${db.settings.currency})</label><input id="exp-amount" type="number" inputmode="decimal" required min="0.01" step="0.01" placeholder="e.g. 250" value="${e.amount}"></div><div class="field"><label for="exp-desc">Description (optional)</label><textarea id="exp-desc" maxlength="400" placeholder="Ticket, route, trip details…">${esc(e.description||'')}</textarea></div><div class="dialog-actions">${d.id?`<button type="button" class="btn danger" data-action="delete-expense" data-id="${d.id}">Delete</button>`:''}<button class="btn" type="button" data-action="close-dialog">Cancel</button><button type="button" class="btn primary" data-action="save-expense">Save expense</button></div></div>`}
if(d.type==='target'){const w=weekly(d.week),baseline=db.rules[d.week]?.target??(db.settings.policy.filter(p=>p.from<=d.week).at(-1)?.target??db.settings.weeklyTarget);content=`<div class="dialog-head"><div><p class="eyebrow">WEEKLY REQUIREMENT</p><h2>${fmt(d.week)} – ${fmt(weekEnd(d.week))}</h2></div><button class="close" data-action="close-dialog">×</button></div><form id="target-form"><div class="field"><label for="target-number">Required credited days this week</label><input id="target-number" type="number" min="0" max="7" step="1" value="${baseline}" required></div><div class="field"><label for="target-note">Reason (optional)</label><textarea id="target-note" maxlength="400" placeholder="Holiday week / management approval">${esc(db.rules[d.week]?.note||'')}</textarea></div><div class="insight">Weekly target: <strong>${w.target}</strong> days. Office, holiday and leave each count as one credited day. No double deduction.</div><div class="dialog-actions"><button type="button" class="btn danger" data-action="remove-target" data-week="${d.week}">Use default</button><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="submit" class="btn primary">Save target</button></div></form>`}
return `<div class="dialog-backdrop" data-action="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="${d.type} editor">${content}</div></div>`}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n')}
function reportText(){const s=ui.reportMode==='monthly'?monthStats(ui.reportMonth):weekly(ui.reportWeek);return `Orbit attendance report (${s.start} to ${s.end})\nRequired: ${s.target}\nPlanned: ${s.planned??s.plan}\nActual office visits: ${s.actual}\nCredited (office + holiday + leave): ${s.credited}\nRemaining: ${Math.max(0,s.target-s.credited)}\nRemote: ${s.remote}\nHolidays: ${s.holiday}\nLeave: ${s.leave}\nExpenses: ${rupee(s.spend)}`}
function exportReport(){const s=ui.reportMode==='monthly'?monthStats(ui.reportMonth):weekly(ui.reportWeek);const rows=[['Orbit attendance and commute report',`${s.start} to ${s.end}`],['Metric','Value'],['Required',s.target],['Planned',s.planned??s.plan],['Actual office visits',s.actual],['Credited (office + holiday + leave)',s.credited],['Remaining',Math.max(0,s.target-s.credited)],['Remote',s.remote],['Holidays',s.holiday],['Leave',s.leave],['Commute expense',s.spend],[],['Date','Attendance','Planned','Expense','Notes']];for(const date of allDates(s.start,s.end))rows.push([date,STATUS[attendance(date)].name,planned(date)?'Yes':'No',expenseDay(date),db.attendance[date]?.note||'']);rows.push([],['Expense entries'],['Date','Category','Amount','Description']);for(const e of db.expenses.filter(e=>between(e.date,s.start,s.end)))rows.push([e.date,e.category,e.amount,e.description]);download(`orbit-report-${s.start}-${s.end}.csv`,csv(rows),'text/csv;charset=utf-8')}
function changeSetting(key,value){if(key==='weeklyTarget'){const target=num(value),from=addDays(weekStart(TODAY),7);db.settings.weeklyTarget=target;db.settings.policy=db.settings.policy.filter(p=>p.from!==from);db.settings.policy.push({from,target});db.settings.policy.sort((a,b)=>a.from.localeCompare(b.from));toast('New default applies from next week')}else{db.settings[key]=value;toast('Preference saved')}update()}
function removeExpense(id,returnDate=null){
 const index=db.expenses.findIndex(e=>String(e.id)===String(id));
 if(index<0){toast('Expense not found. Refresh the date and try again.');return}
 const entry=db.expenses[index];db.expenses.splice(index,1);
 db.demo=false;ui.dialog=returnDate?{type:'day-choice',date:returnDate}:null;
 update();toast(`${entry.category} expense deleted`);
}
function askDeleteExpense(id,returnDate=null){
 const entry=db.expenses.find(e=>String(e.id)===String(id));if(!entry){toast('Expense not found');return}
 ui.dialog={type:'confirm-delete-expense',id:entry.id,returnDate:returnDate||entry.date};render();
}
function resetRecords(withDemo){if(!confirm('Delete ALL attendance, ticket details, plans, weekly overrides and expenses? Export a backup first.'))return;if(withDemo)db=blank();else{db.attendance={};db.expenses=[];db.rules={};db.plans={};db.travel={};db.tickets={};db.demo=false}ui.dialog=null;update();toast('Records cleared')}
function isValidImport(o){return o&&o.version===1&&o.settings&&o.attendance&&typeof o.attendance==='object'&&!Array.isArray(o.attendance)&&Array.isArray(o.expenses)&&o.expenses.every(e=>e&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&CATS.includes(e.category)&&Number.isFinite(e.amount)&&e.amount>=0)&&Object.entries(o.attendance).every(([d,r])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&STATUS[r?.status])}
async function importFile(file){if(!file)return;try{const o=JSON.parse(await file.text());if(!isValidImport(o))throw Error('Invalid or incompatible Orbit backup');if(!confirm('Replace all current records with this backup?'))return;db={...o,settings:{...structuredClone(DEFAULTS),...o.settings},rules:o.rules||{},plans:o.plans||{},travel:o.travel||{},demo:false};update();toast('Backup restored')}catch(e){alert(`Unable to import: ${e.message}`)}}
function saveAttendanceDay(){
 const form=document.getElementById('attendance-form');
 if(!form){alert('Attendance editor is not available. Please reopen the selected date.');return}
 const date=form.querySelector('[name="date"]')?.value;
 const status=form.querySelector('#attendance-status')?.value;
 const note=form.querySelector('#attendance-note')?.value.trim()||'';
 const plannedFlag=!!form.querySelector('#attendance-planned')?.checked;
 const dest=form.querySelector('#attendance-reschedule')?.value||'';
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!STATUS[status]){alert('Please select a valid attendance status and date.');return}
 if(dest&&dest!==date&&weekStart(dest)!==weekStart(date)){
   if(!confirm('The new date falls in a different week. Weekly requirements do not transfer automatically. Continue?'))return;
 }
 const original=db.attendance[date]||{};
 if(status==='none')delete db.attendance[date];
 else db.attendance[date]={...original,status,note};
 db.plans[date]=plannedFlag;
 if(dest&&dest!==date){
   db.plans[date]=false;
   db.plans[dest]=true;
   if(db.attendance[date])db.attendance[date].changedTo=dest;
   db.attendance[dest]={...(db.attendance[dest]||{note:''}),changedFrom:date};
   if(db.attendance[dest].status==='none')delete db.attendance[dest].status;
 }
 db.demo=false;ui.dialog=null;update();toast('Day saved successfully ✓');
}
function saveExpense(){
 const form=document.getElementById('expense-form');
 if(!form){alert('Expense editor is not available. Please reopen it.');return}
 const date=form.querySelector('#exp-date')?.value,category=form.querySelector('#exp-category')?.value;
 const raw=form.querySelector('#exp-amount')?.value,amount=Number(raw),description=form.querySelector('#exp-desc')?.value.trim()||'';
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!CATS.includes(category)||raw===''||!Number.isFinite(amount)||amount<=0){alert('Please enter a valid date, category and amount greater than zero.');return}
 const old=db.expenses.find(x=>String(x.id)===String(ui.dialog?.id));
 if(old)Object.assign(old,{date,category,amount,description});
 else db.expenses.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),date,category,amount,description});
 db.demo=false;ui.dialog=ui.dialog?.returnDate?{type:'day-choice',date:ui.dialog.returnDate}:null;update();toast('Expense saved successfully ✓');
}
function handleAction(el){const a=el.dataset.action;switch(a){case 'cloud-logout':void (async()=>{await pushCloud();await cloudClient.auth.signOut();cloud.user=null;db=blank();render()})();break;case 'cloud-import-legacy':{const raw=localStorage.getItem(KEY);if(!raw){toast('No old local Orbit data found on this browser');break}try{const legacy=JSON.parse(raw);if(legacy.version!==1||!Array.isArray(legacy.expenses)||!legacy.attendance)throw Error('Invalid backup');if(!confirm('Replace current cloud records with old local Orbit records? Export a cloud backup first.'))break;db={...blank(),...legacy,settings:{...DEFAULTS,...legacy.settings}};update();toast('Old records imported to cloud')}catch(e){alert('Import failed: '+e.message)}break}case 'navigate':ui.page=el.dataset.page;ui.dialog=null;render();window.scrollTo(0,0);break;
case 'save-attendance-day':saveAttendanceDay();break;
case 'save-expense':saveExpense();break;
case 'open-day-choice':ui.dialog={type:'day-choice',date:el.dataset.date||TODAY};ui.selectedDate=el.dataset.date||TODAY;render();break;
case 'day-office':ui.dialog={type:'office-quick',date:el.dataset.date};render();break;
case 'day-travel':ui.dialog={type:'travel-quick',date:el.dataset.date};render();break;
case 'save-quick-status':{const date=el.dataset.date,status=el.dataset.status,original=db.attendance[date]||{};if(!STATUS[status])break;if(status==='none')delete db.attendance[date];else db.attendance[date]={...original,status,note:original.note||''};if(status==='holiday'||status==='leave')db.plans[date]=false;db.demo=false;ui.dialog={type:'office-quick',date};update();toast('Attendance saved');break}
case 'fetch-pnr':{
 const date=el.dataset.date,pnr=(document.getElementById('ticket-pnr')?.value||'').trim();
 if(!/^\d{10}$/.test(pnr)){toast('Enter a valid 10-digit PNR');document.getElementById('ticket-pnr')?.focus();break;}
 fetchRailkitPNR(date,pnr,el);break;}
case 'toggle-journey':{const date=el.dataset.date,kind=el.dataset.kind;if(!['outbound','return'].includes(kind))break;const current=travelKinds(date);const next=current.includes(kind)?current.filter(k=>k!==kind):[...current,kind];if(next.length)db.travel[date]=next;else delete db.travel[date];db.demo=false;ui.dialog={type:'travel-quick',date};update();toast(next.includes(kind)?'Journey saved':'Journey removed');break}
case 'open-attendance':ui.dialog={type:'attendance',date:el.dataset.date||TODAY};render();break;
case 'pick-status':document.getElementById('attendance-status').value=el.dataset.status;document.querySelectorAll('.status-choice').forEach(x=>x.classList.toggle('selected',x.dataset.status===el.dataset.status));break;
case 'quick-office':case 'quick-status':db.attendance[TODAY]={...db.attendance[TODAY],status:a==='quick-office'?'office':el.dataset.status,note:db.attendance[TODAY]?.note||''};db.demo=false;update();toast('Today’s attendance saved');break;
case 'open-expense':ui.dialog={type:'expense',date:el.dataset.date||TODAY,returnDate:el.dataset.date||null};render();break;
case 'edit-expense':ui.dialog={type:'expense',id:el.dataset.id,returnDate:el.dataset.returnDate||null};render();break;
case 'delete-expense':askDeleteExpense(el.dataset.id,el.dataset.returnDate||ui.dialog?.returnDate||null);break;
case 'confirm-delete-expense':removeExpense(el.dataset.id,ui.dialog?.returnDate||null);break;
case 'cancel-delete-expense':ui.dialog={type:'day-choice',date:ui.dialog.returnDate};render();break;
case 'edit-target':ui.dialog={type:'target',week:el.dataset.week};render();break;
case 'remove-target':delete db.rules[el.dataset.week];ui.dialog=null;db.demo=false;update();toast('Weekly override removed');break;
case 'close-dialog':ui.dialog=null;render();break;
case 'backdrop':if(el.classList.contains('dialog-backdrop')){ui.dialog=null;render()}break;
case 'calendar-prev':case 'calendar-next':{const n=a==='calendar-next'?1:-1;if(ui.calendarMode==='month')ui.calendarMonth=addMonths(ui.calendarMonth,n);else{ui.selectedDate=addDays(ui.selectedDate,7*n);ui.calendarMonth=monthStart(ui.selectedDate)}render();break}
case 'calendar-today':ui.calendarMonth=monthStart(TODAY);ui.selectedDate=TODAY;render();break;
case 'calendar-mode':ui.calendarMode=el.dataset.mode;render();break;
case 'analytics-range':ui.analyticRange=el.dataset.value;render();break;
case 'report-mode':ui.reportMode=el.dataset.mode;render();break;
case 'report-prev':case 'report-next':{const n=a==='report-next'?1:-1;if(ui.reportMode==='monthly')ui.reportMonth=addMonths(ui.reportMonth,n);else ui.reportWeek=addDays(ui.reportWeek,7*n);render();break}
case 'export-report':exportReport();toast('CSV report downloaded');break;
case 'print-report':window.print();break;
case 'share-report':{const txt=reportText();if(navigator.share)navigator.share({title:'Orbit attendance report',text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>toast('Report copied to clipboard')).catch(()=>toast('Use Download CSV instead'));break}
case 'toggle-weekday':{const day=Number(el.dataset.day);db.settings.preferred=db.settings.preferred.includes(day)?db.settings.preferred.filter(d=>d!==day):[...db.settings.preferred,day].sort();update();break}
case 'export-json':download(`orbit-backup-${TODAY}.json`,JSON.stringify(db,null,2),'application/json');toast('Backup downloaded');break;
case 'import-json':document.getElementById('import-file').click();break;
case 'clear-demo':resetRecords(false);break;
case 'reset-demo':resetRecords(true);break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='backdrop'&&e.target!==el)return;e.preventDefault();handleAction(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='import-file'){importFile(el.files[0]);return}if(el.id==='expense-period'){ui.expensePeriod=el.value;render();return}if(el.id==='expense-category'){ui.expCategory=el.value;render();return}if(el.id.startsWith('setting-')){const key=el.id.replace('setting-','');const val=el.type==='checkbox'?el.checked:key==='weekStart'||key==='weeklyTarget'?Number(el.value):el.value;changeSetting(key,val)}});
document.addEventListener('input',e=>{if(e.target.id==='expense-search'){const input=e.target,from=input.selectionStart;ui.expenseSearch=input.value;render();const next=document.getElementById('expense-search');next?.focus();next?.setSelectionRange(from,from)}});
document.addEventListener('submit',e=>{if(e.target.id==='cloud-login-form'){void submitCloudLogin(e);return}if(!['attendance-form','expense-form','target-form'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='attendance-form'){saveAttendanceDay();return}
if(e.target.id==='expense-form'){saveExpense();return;}
if(e.target.id==='target-form'){const t=Number(document.getElementById('target-number').value);if(!Number.isInteger(t)||t<0||t>7)return;db.rules[ui.dialog.week]={target:t,note:document.getElementById('target-note').value.trim()};db.demo=false;ui.dialog=null;update();toast('Weekly requirement saved')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.dialog){ui.dialog=null;render()}});
// Initialize today's values without changing stored attendance.
ui.calendarMode='month';
void bootstrapCloud();


document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloud.user&&!cloud.dirty&&!cloud.busy)void pullCloud()});
// Protect the single-page editor against native form navigation in embedded/file browsers.
document.addEventListener('submit',e=>e.preventDefault(),true);

</script>
</body></html>
